# 主入口（L1 常驻）：只放与环境无关、dev/pro 完全一致的基础配置 + 领域片段导入锚点。
# 环境相关（数据源 / redis / jwt 密钥 / 日志级别 / knife4j 开关）下沉到 application-{profile}.yml。
    # 领域行为配置（his-ai / his-insurance / his-sign / his-medicaltech / his-sms / his-wechat / his-followup）
    #   抽到 config/domain/his-*.yml（可入库、零密钥，dev/pro 共用同一份，不再双写）。
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # 领域片段：常驻、dev/pro 共用；optional: 防片段缺失时启动直接挂。
    # Spring Boot 的 import 通配符必须按目录（*/）导入，不认 *.yml 文件通配，故逐一列出。
    import:
      - optional:classpath:config/domain/his-ai.yml
      - optional:classpath:config/domain/his-insurance.yml
      - optional:classpath:config/domain/his-medicaltech.yml
      - optional:classpath:config/domain/his-sign.yml
      - optional:classpath:config/domain/his-sms.yml
      - optional:classpath:config/domain/his-wechat.yml
      - optional:classpath:config/domain/his-followup.yml
  application:
    name: his-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  setting:
    language: zh_cn
