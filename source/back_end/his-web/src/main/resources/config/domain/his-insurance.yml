# 医保合规审核配置
his:
  insurance:
    # 医保联网结算总开关：true=支持医保结算（按 channel.mode 远程查参保）；
    # false=不支持医保结算，结算时按自费原价走，不查医保
    enabled: true
    # 通道实现（mode）与平台地址（base-url）随环境变，落 profile 文件；这里只管超时
    channel:
      connect-timeout-ms: 5000
      read-timeout-ms: 15000
    # 报文国密（SM2 签名 + SM4 加密 + csssl 证书链）：院内段 SM4 密钥与前置机 mig.crypto.sm4-key-his 一致；
    # 生产用环境变量 HIS_INS_SM4_KEY / HIS_INS_CRYPTO_ENABLED 覆盖
    crypto:
      enabled: ${HIS_INS_CRYPTO_ENABLED:true}
      sm4-key: ${HIS_INS_SM4_KEY:d4ed4bcc79219747db32bd6fbcd97fe8}
      private-key: classpath:crypto/hisins-private.pem
      cert-chain: classpath:crypto/hisins-cert.pem
      root-ca: classpath:crypto/root-ca.pem
      sub-ca: classpath:crypto/sub-ca.pem
      clock-skew-seconds: 300
    compliance:
      # 总开关。false 时审核接口直接报错拒绝，不会给出误导性的「全部通过」
      enabled: true
      # 高倍率阈值：费用倍率 > 该值 判为高编高套嫌疑
      high-cost-ratio: 2.0
      # 低倍率阈值：费用倍率 < 该值 判为低编入组嫌疑
      low-cost-ratio: 0.5
      # 最短住院天数：低于该值且无手术 → 低标入院嫌疑（当前因无住院管理模块无法计算，返回「不适用」）
      min-inpatient-days: 3
      # 分解住院回看窗口（天）
      readmit-window-days: 15
      # 单条依据文本落库上限（evidence 字段长度限制）
      max-evidence-quote: 300
