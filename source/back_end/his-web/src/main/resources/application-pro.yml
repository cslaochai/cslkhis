spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${HIS_DB_URL:}
    username: ${HIS_DB_USERNAME:}
    password: ${HIS_DB_PASSWORD:}
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      connection-test-query: SELECT 1
  data:
    redis:
      host: ${HIS_REDIS_HOST:}
      port: 6379
      password: ${HIS_REDIS_PASSWORD:}
      database: 0
      timeout: 5000

jwt:
  # 签名密钥
  secret: ${HIS_JWT_SECRET:}
  expiration: 86400000  # 24小时

his:
  # 签名主密钥
  sign:
    master-secret: ${HIS_SIGN_SECRET:}
  # AI 密钥
  ai:
    api-key: ${HIS_AI_API_KEY:}
    asr:
      api-key: ${HIS_AI_API_KEY:}
  # 随访外呼通道：mock=人工（护士自拨，只登记「待外呼」）。
  followup:
    call-channel: mock

knife4j:
  enable: false

logging:
  level:
    com.his: info
