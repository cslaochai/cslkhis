# 生产环境：只写「与 dev 取值不同」的项，真值由容器 .env 注入（清单见 docker/.env.example）
spring:
  datasource:
    url: ${HIS_DB_URL:}
    username: ${HIS_DB_USERNAME:}
    password: ${HIS_DB_PASSWORD:}
  data:
    redis:
      host: ${HIS_REDIS_HOST:}
      password: ${HIS_REDIS_PASSWORD:}

rocketmq:
  name-server: ${HIS_ROCKETMQ_NAME_SERVER:}

jwt:
  # 签名密钥
  secret: ${HIS_JWT_SECRET:}

his:
  # 模型访问密钥：生产只从环境变量注入，dev 内联真值
  ai:
    api-key: ${HIS_AI_API_KEY:}
    rag:
      milvus:
        uri: ${HIS_MILVUS_URL:}
        token: ${HIS_MILVUS_TOKEN:}
  # 电子签名证书：CA 在线申请（csssl 对外 RA API）
  # 环境相关的值在本文件声明；迭代次数、有效期、超时、接口路径等固定契约在 config/domain/his-platform.yml
  sign:
    # 签名主口令：不注入即拒绝签发证书（私钥绝不明文落库）
    master-secret: ${HIS_SIGN_SECRET:}
    # 证书主体 O（机构名），必须与 CA 侧租户登记的「证书主体O」一致
    organization: ${HIS_SIGN_ORG:长沙市麓康医院}
    # CA 在线申请：App ID / 接入密钥由 CSSSL 建租户时颁发，直接写死在这里（不走环境变量）。
    # 132 部署时 csssl-backend 映射到宿主 8012（容器内 8092），HIS 容器经 host.docker.internal 访问；
    # HIS 对外只有「提交申请」与「吊销证书」两个出站调用，状态变更由 CA 推送到 /api/emr/signCert/caCallback
    ca:
      enabled: true
      base-url: http://host.docker.internal:8012/ssl
      app-id: app_a295062ed8c9f4177b888cceb6d7c5b9
      app-secret: sk_c78dd9c0e7a84d9ef545c30d063ff35fcc2bfd4db66616c6f680060cf52773d1
  insurance:
    channel:
      # remote=调医保前置系统(csmig)；生产必须给真实前置机地址，localhost 默认值只够本机联调
      mode: ${HIS_INSURANCE_MODE:remote}
      base-url: ${HIS_INSURANCE_BASE_URL:http://localhost:8091/mig}
  sms:
    code:
      # 测试开关：true=不走网关、验证码回显。漏配即失败关闭
      mock: ${HIS_SMS_MOCK:false}
  security:
    sm2:
      # 登录口令传输加密 SM2 私钥（64 位十六进制）：写死固定值，重启不失效（前端缓存公钥不失效）
      private-key: 4d6bbacc8ed26115af889aa117e43050e1da940f8e6d33a1c22611da6b2f80b8
  followup:
    channel:
      aliyun-vms:
        access-key-id: ${HIS_CALL_ACCESS_KEY_ID:}
        access-key-secret: ${HIS_CALL_ACCESS_KEY_SECRET:}
        called-show-number: ${HIS_CALL_SHOW_NUMBER:}
        tts-code: ${HIS_CALL_TTS_CODE:}

wxpay:
  app-id: ${WX_PAY_APP_ID:}
  mch-id: ${WX_PAY_MCH_ID:}
  api-v3-key: ${WX_PAY_API_V3_KEY:}
  cert-serial-no: ${WX_PAY_CERT_SERIAL_NO:}
  private-key-path: ${WX_PAY_PRIVATE_KEY_PATH:}
  notify-url: ${WX_PAY_NOTIFY_URL:https://your-domain.com/api/pay/notify/wx}

alipay:
  # true=启用支付宝直连（需同时注入 app-id/私钥/公钥）；false=渠道关闭
  enabled: ${ALIPAY_ENABLED:false}
  app-id: ${ALIPAY_APP_ID:}
  private-key: ${ALIPAY_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  gateway-url: ${ALIPAY_GATEWAY:http://openapi-sandbox.dl.alipaydev.com/gateway.do}
  notify-url: ${ALIPAY_NOTIFY_URL:}
  notify-url-cashier: ${ALIPAY_NOTIFY_URL_CASHIER:}

unionpay:
  app-id: ${UNIONPAY_APP_ID:}
  mer-id: ${UNIONPAY_MER_ID:}
  private-key: ${UNIONPAY_PRIVATE_KEY:}
  public-key: ${UNIONPAY_PUBLIC_KEY:}
  gateway-url: ${UNIONPAY_GATEWAY:https://gateway.95516.com}

knife4j:
  # 接口文档生产关闭；dev 在 application-dev.yml 里开着
  enable: false
