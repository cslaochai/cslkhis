spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # 领域片段：常驻、dev/pro 共用；optional: 防片段缺失时启动直接挂。
    import:
      - optional:classpath:config/domain/his-ai.yml
      - optional:classpath:config/domain/his-insurance.yml
      - optional:classpath:config/domain/his-medicaltech.yml
      - optional:classpath:config/domain/his-sign.yml
      - optional:classpath:config/domain/his-sms.yml
      - optional:classpath:config/domain/his-followup.yml
      - optional:classpath:config/domain/his-pay.yml
  application:
    name: his-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志走 SLF4J，受 logging.level 控制；StdOutImpl 直打 stdout 无法屏蔽
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  setting:
    language: zh_cn

# RocketMQ 公共配置：地址与生产组走环境变量，topic/consumer 组代码常量定义在 com.his.common.mq.HisMqTopics
rocketmq:
  name-server: ${HIS_ROCKETMQ_NAME_SERVER:}
  producer:
    group: ${HIS_ROCKETMQ_PRODUCER_GROUP:HIS_PG_DEFAULT}
    # 发送超时：业务线程不被外部 broker 拖死
    send-message-timeout: 3000
    # 同步刷盘策略下的重试次数
    retry-times-when-send-failed: 2
