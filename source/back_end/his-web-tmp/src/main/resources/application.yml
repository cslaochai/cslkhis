spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # 领域片段
    import:
      - optional:classpath:config/domain/his-ai.yml
      - optional:classpath:config/domain/his-insurance.yml
      - optional:classpath:config/domain/his-medicaltech.yml
      - optional:classpath:config/domain/his-platform.yml
      - optional:classpath:config/domain/his-sms.yml
      - optional:classpath:config/domain/his-followup.yml
      - optional:classpath:config/domain/his-charge.yml
  application:
    name: his-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      connection-test-query: SELECT 1
  data:
    redis:
      port: 6379
      database: 0
      timeout: 5000

# token 有效期两环境一致；签名密钥属环境项，落 profile 文件
jwt:
  expiration: 86400000

server:
  port: 8080
  servlet:
    context-path: /api

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  setting:
    language: zh_cn

rocketmq:
  producer:
    group: ${HIS_ROCKETMQ_PRODUCER_GROUP:HIS_PG_DEFAULT}
    # 发送超时：业务线程不被外部 broker 拖死
    send-message-timeout: 3000
    # 同步刷盘策略下的重试次数
    retry-times-when-send-failed: 2

# 业务日志级别两环境同值，声明一次；dev 要开 SQL 调试就在 application-dev.yml 里覆盖成 debug
logging:
  level:
    com.his: info
