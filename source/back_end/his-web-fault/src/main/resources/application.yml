server:
  # 只绑回环：演练接口不带鉴权，绝不能被同网段其他机器调到
  address: 127.0.0.1
  port: 18090
  tomcat:
    # Boot 3 默认不注册 Tomcat MBean，不开这一段 actuator 就没有 tomcat.threads.busy
    mbeanregistry:
      enabled: true
    # 与线上默认一致（200），线程耗尽场景才有对照意义
    threads:
      max: 200
      min-spare: 10

spring:
  application:
    name: his-web-fault
  # 独立 jar 启动时默认不注册 JMX，Hikari 连接池 MXBean 会拿不到；打开后 poolStatus 才可用
  jmx:
    enabled: true
  datasource:
    # 内存 H2，MODE=MySQL 让 LIKE / ORDER BY 行为贴近院内 MySQL；不连业务库
    url: jdbc:h2:mem:faultlab;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: FaultLabHikariPool
      # 独立 jar 启动时默认不注册 JMX，连接池水位接口会拿不到 MXBean；这里显式打开
      register-mbeans: true
      maximum-pool-size: 10
      minimum-idle: 2
      # 线上默认 30s，演练调成 3s，否则一次演示要等半分钟
      connection-timeout: 3000
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,threaddump,heapdump,loggers
  endpoint:
    health:
      show-details: always

fault:
  enabled: true
  max-cpu-threads: 8
  max-cpu-seconds: 60
  max-retain-mb: 512
  max-hold-seconds: 120
  max-concurrency: 400
  heap-chunk-mb: 8

logging:
  level:
    com.his.webfault: info
    org.springframework: warn
  file:
    name: run/logs/his-web-fault.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
