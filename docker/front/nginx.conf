server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 spring.servlet.multipart.max-request-size 对齐，否则大附件被 nginx 先拒成 413
    client_max_body_size 60m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 后端容器（compose 同一网络，服务名即 DNS 名）。
    # proxy_pass 的 host 走变量 = 请求期才解析，后端没起来时 nginx 仍能启动（否则 host not found 直接退出）；
    # 变量方式必须显式指定 Docker 内嵌 DNS，不然报 "no resolver defined to resolve his-backend"。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $his_backend his-backend:8080;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口不缓存，避免改版后拿到旧 index.html 引不到新 hash 资源
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 context-path 就是 /api，转发时不要剥前缀
    location ^~ /api/ {
        proxy_pass http://$his_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/system/message/sse 是 text/event-stream，开缓冲会把事件攒到超时才吐
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 影像与导诊单 PDF 由后端写在 ${user.dir}/uploads 下，经 /uploads/** 静态映射对外
    location ^~ /uploads/ {
        proxy_pass http://$his_backend;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
}
