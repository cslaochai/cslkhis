services:
  his-backend:
    build:
      context: ./backend
    image: his-backend:local
    container_name: his-backend
    restart: unless-stopped
    # 连接串与口令全部来自同目录 .env（该文件不入库），application-pro.yml 里只有 ${HIS_*:} 占位
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms512m -Xmx2g -XX:+UseG1GC -Duser.timezone=Asia/Shanghai
    ports:
      - "8009:8080"
    # MySQL / Redis 是宿主机上的进程（非容器），容器内用 host.docker.internal 回到宿主
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 运行时数据卷：影像/导诊单等写在容器内 /app/cslk-data（compose 挂到宿主 ./cslk-data），
      # 医保国密证书同卷的 crypto 子目录；重建镜像不丢产物，私钥也不再打进 jar
      - ./cslk-data:/app/cslk-data
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080" ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 90s
    networks:
      - his

  his-front:
    build:
      context: ./front
    image: his-front:local
    container_name: his-front
    restart: unless-stopped
    ports:
      - "3100:80"
    depends_on:
      his-backend:
        condition: service_healthy
    networks:
      - his

networks:
  his:
    driver: bridge
